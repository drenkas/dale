# Serves install.sh from the fork at https://renkas.pp.ua/dale-install.sh.
# The script always tracks main, so releases need no server changes.
#
# Include this file inside the `server { ... }` block that serves
# renkas.pp.ua over HTTPS, then run `nginx -t` and reload nginx:
#
#   include /etc/nginx/snippets/dale-install.conf;
#
# The upstream host is held in a variable so nginx resolves it again when its
# address changes, instead of once at startup.

location = /dale-install.sh {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    set $dale_origin "raw.githubusercontent.com";
    proxy_pass https://$dale_origin/drenkas/dale/main/install.sh;
    proxy_set_header Host $dale_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $dale_origin;

    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Type "text/x-shellscript; charset=utf-8" always;
    add_header Cache-Control "public, max-age=300" always;

    proxy_intercept_errors on;
    error_page 404 500 502 503 504 =503 @dale_install_unavailable;
}

location @dale_install_unavailable {
    default_type text/x-shellscript;
    return 503 "# dale install script temporarily unavailable\n";
}
